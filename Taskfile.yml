version: "3"

tasks:
  check:staged:
    desc: Validate renovate config JSON and run node tests (pre-commit entry)
    cmds:
      - task: checks

  check:merge:
    desc: Validate renovate config JSON and run node tests (pre-merge entry)
    cmds:
      - task: checks

  check:all:
    desc: Validate renovate config JSON and run node tests (same checks as CI)
    cmds:
      - task: checks

  checks:
    internal: true
    preconditions:
      - sh: command -v nix >/dev/null 2>&1
        msg: "nix not found in PATH; install nix to run the checks"
    cmds:
      - |
        nix shell nixpkgs#nodejs_24 nixpkgs#yarn -c bash -euc '
          yarn install --frozen-lockfile --non-interactive
          while IFS= read -r file; do
            echo "Validate ${file}"
            node_modules/.bin/renovate-config-validator --strict "${file}"
          done < <(find . -maxdepth 2 -type f -name "*.json" -not -name package.json -not -name package-lock.json | sort)
          node --test "tests/*.test.mjs"
        '

  accept:lookup:
    desc: Run renovate lookup with the nix preset against a source repo clone (needs network, ssh and a gh token; not part of check:all)
    preconditions:
      - sh: command -v nix >/dev/null 2>&1
        msg: "nix not found in PATH; install nix to run the lookup"
    cmds:
      - |
        nix shell nixpkgs#nodejs_24 nixpkgs#yarn nixpkgs#jq -c bash -euc '
          for name in $(compgen -e | grep "^GIT_" || true); do unset "${name}"; done

          token="$(gh auth token 2>/dev/null || true)"
          if [ -z "${token}" ]; then
            echo "accept:lookup: no GitHub token from '\''gh auth token'\''; run '\''gh auth login'\''" >&2
            exit 1
          fi

          root="$(pwd)"
          scratch="$(mktemp -d "${TMPDIR:-/tmp}/accept-lookup.XXXXXX")"
          trap '\''rm -rf "${scratch}"'\'' EXIT
          source="${ACCEPT_SOURCE:-git@github.com:naa0yama-org/boilerplate-rust.git}"

          yarn install --frozen-lockfile --non-interactive >&2
          git clone --quiet --depth 1 "${source}" "${scratch}/repo" >&2
          echo "accept:lookup: source commit $(git -C "${scratch}/repo" rev-parse HEAD)" >&2

          node -e '\''
            const fs = require("node:fs");
            const preset = JSON.parse(fs.readFileSync("extends/nix.json", "utf8"));
            delete preset.$schema;
            fs.writeFileSync(process.argv[1], JSON.stringify({
              ...preset,
              minimumReleaseAge: "7 days",
              onboarding: false,
            }));
          '\'' "${scratch}/config.json"

          (
            cd "${scratch}/repo"
            RENOVATE_CONFIG_FILE="${scratch}/config.json" GITHUB_COM_TOKEN="${token}" \
              LOG_LEVEL=debug LOG_FORMAT=json \
              "${root}/node_modules/.bin/renovate" --platform=local --dry-run=lookup --require-config=optional \
              >"${scratch}/renovate.log"
          )

          jq -c '\''select(.msg == "getReleases statistics summary") | .datasources[].registryUrls | to_entries[]
            | {request: .key, count: .value.stats.count}'\'' "${scratch}/renovate.log" >&2
          jq -c '\''select(.msg == "packageFiles with updates") | .config.regex[].deps[]
            | {depName, currentValue, currentDigest, currentVersionTimestamp,
               updates: [(.updates // [])[] | {newValue, newDigest, releaseTimestamp, branchName}]}'\'' "${scratch}/renovate.log"
        '
