version: "3"

tasks:
  check:staged:
    desc: Validate renovate config JSON and run node tests (pre-commit entry)
    cmds:
      - task: checks

  check:merge:
    desc: Validate renovate config JSON and run node tests (pre-merge entry)
    cmds:
      - task: checks

  check:all:
    desc: Validate renovate config JSON and run node tests (same checks as CI)
    cmds:
      - task: checks

  checks:
    internal: true
    preconditions:
      - sh: command -v nix >/dev/null 2>&1
        msg: "nix not found in PATH; install nix to run the checks"
    cmds:
      - |
        nix shell nixpkgs#nodejs_24 nixpkgs#yarn nixpkgs#bats nixpkgs#jq -c bash -euc '
          yarn install --frozen-lockfile --non-interactive
          while IFS= read -r file; do
            echo "Validate ${file}"
            node_modules/.bin/renovate-config-validator --strict "${file}"
          done < <(find . -maxdepth 2 -type f -name "*.json" -not -name package.json -not -name package-lock.json | sort)
          node --test "tests/*.test.mjs"
          bats tests/
        '

  accept:lookup:
    desc: Run renovate lookup with the nix preset against a source repo clone (needs network, ssh and a gh token; not part of check:all)
    preconditions:
      - sh: command -v nix >/dev/null 2>&1
        msg: "nix not found in PATH; install nix to run the lookup"
    cmds:
      - nix shell nixpkgs#nodejs_24 nixpkgs#yarn nixpkgs#jq -c bash -c 'PATH="${PWD}/node_modules/.bin:${PATH}" exec scripts/accept-lookup.sh'

  accept:compare:
    desc: Compare the nix preset's lookup against devkit-flake-pin update on a source repo clone (needs network, ssh, a gh token and nix develop; not part of check:all)
    preconditions:
      - sh: command -v nix >/dev/null 2>&1
        msg: "nix not found in PATH; install nix to run the comparison"
    env:
      TASK_BIN: "{{.TASK_EXE}}"
    cmds:
      - nix shell nixpkgs#nodejs_24 nixpkgs#yarn nixpkgs#jq -c bash -c 'PATH="${PWD}/node_modules/.bin:${PATH}" exec scripts/accept-compare.sh'
